[env:attiny13a]
platform = atmelavr
board = attiny13a
board_build.f_cpu = 1200000L ; 1.2 MHz internal oscillator (factory default)

; Arduino as ISP configuration
upload_protocol = stk500v1
upload_speed = 19200
upload_port = /dev/ttyACM0 ; Adjust for your system (e.g., /dev/ttyUSB0 or COM3)
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

; Standard 1.2 MHz fuse settings (Low: 0x6A, High: 0xFF)
board_fuses.low = 0x6Aw
board_fuses.high = 0xFF