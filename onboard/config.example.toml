[bus]
number = 1
hz = 100000

[peers]
motor_address = 8
comms_address = 9
motor_component = 154
comms_component = 158

[scheduler]
poll_interval_ms = 20
queue_limit = 128

[service]
# The normal serve/SSH path keeps the comms Pico enabled. Direct radio mode
# forces this false so it never polls or writes I2C address 0x09.
comms_enabled = true

# Generic six-axis register layout example. Supply the actual IMU address,
# starting register and scale factors from its datasheet before live use.
# Values below are illustrative and are not a selected hardware driver.
[imu]
enabled = false
address = 104
register = 59
sample_size = 12
byte_order = "little"
signed = true
accel_scale_mg_per_count = 1.0
gyro_scale_mrad_s_per_count = 1.0
interval_ms = 100
